<table
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="
    font-family: Arial, Helvetica, sans-serif;
    color: #35363A;
    border-collapse: collapse;
  "
>
  <tr>

    <!-- LOGO -->
    <td
      style="
        padding-right:18px;
        vertical-align:middle;
        text-align:center;
      "
    >
      <a
        href="https://www.ceoempowers.org"
        target="_blank"
        style="text-decoration:none;"
      >
        <img
          src="https://www.ceoempowers.org/wp-content/uploads/2023/08/ceo-logo-circle.png"
          alt="Commission on Economic Opportunity"
          width="145"
          style="
            display:block;
            width:145px;
            max-width:145px;
            height:auto;
            border:0;
          "
        >
      </a>
    </td>

    <!-- PURPLE DIVIDER -->
    <td
      width="2"
      style="
        width:2px;
        background-color:#7B4198;
        padding:0;
        margin:0;
        font-size:1px;
        line-height:1px;
      "
    >
      &nbsp;
    </td>

    <!-- CONTACT INFO -->
    <td
      style="
        padding-left:18px;
        vertical-align:middle;
        min-width:300px;
      "
    >

      <div
        id="sigName"
        style="
          font-size:16px;
          font-weight:bold;
          color:#35363A;
          line-height:21px;
        "
      >
        Your Name
      </div>

      <div
        id="sigTitle"
        style="
          font-size:13px;
          color:#35363A;
          line-height:18px;
        "
      >
        Your Job Title
      </div>

      <div style="height:14px;line-height:14px;">
        &nbsp;
      </div>

      <div
        id="locationBlock"
        style="
          display:none;
          font-size:12px;
          color:#35363A;
          line-height:17px;
        "
      >
        <div
          id="sigLocation"
          style="font-weight:bold;"
        ></div>

        <div id="sigAddress"></div>
      </div>

      <div
        id="locationSpacing"
        style="
          display:none;
          height:12px;
          line-height:12px;
        "
      >
        &nbsp;
      </div>

      <div
        style="
          font-size:13px;
          color:#35363A;
          line-height:18px;
        "
      >
        <a
          id="sigPhoneLink"
          href="#"
          style="
            color:#35363A;
            text-decoration:none;
          "
        >
          <span id="sigPhone">(518) 272-6012</span>
          <span id="sigExtension"></span>
        </a>
      </div>

      <div
        style="
          font-size:13px;
          line-height:18px;
        "
      >
        <a
          id="sigEmail"
          href="#"
          style="
            color:#35363A;
            text-decoration:none;
          "
        >
          yourname@ceoempowers.org
        </a>
      </div>

      <div style="height:12px;line-height:12px;">
        &nbsp;
      </div>

      <div
        style="
          font-size:14px;
          font-weight:bold;
          line-height:20px;
        "
      >
        <a
          href="https://www.ceoempowers.org"
          target="_blank"
          style="
            color:#EA1956;
            text-decoration:none;
          "
        >
          ceoempowers.org
        </a>
      </div>

      <div style="height:13px;line-height:13px;">
        &nbsp;
      </div>

      <!-- SOCIAL ICONS -->
      <table cellpadding="0" cellspacing="0" border="0">
        <tr>

          <td style="padding-right:8px;">
            <a
              href="https://facebook.com/ceocap"
              target="_blank"
              style="text-decoration:none;"
            >
              <img
                src="facebook.png"
                alt="Facebook"
                width="28"
                height="28"
                style="
                  display:block;
                  width:28px;
                  height:28px;
                  border:0;
                "
              >
            </a>
          </td>

          <td style="padding-right:8px;">
            <a
              href="https://www.linkedin.com/company/commission-on-economic-opportunity/"
              target="_blank"
              style="text-decoration:none;"
            >
              <img
                src="linkedin.png"
                alt="LinkedIn"
                width="28"
                height="28"
                style="
                  display:block;
                  width:28px;
                  height:28px;
                  border:0;
                "
              >
            </a>
          </td>

          <td>
            <a
              href="https://www.instagram.com/ceotroy/"
              target="_blank"
              style="text-decoration:none;"
            >
              <img
                src="instagram.png"
                alt="Instagram"
                width="28"
                height="28"
                style="
                  display:block;
                  width:28px;
                  height:28px;
                  border:0;
                "
              >
            </a>
          </td>

        </tr>
      </table>

    </td>

  </tr>
</table>
